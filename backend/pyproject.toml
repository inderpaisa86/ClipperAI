[project]
name = "clipperai-backend"
version = "0.1.0"
description = "Backend local de ClipperAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "opencv-python-headless>=5.1.0.95",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
